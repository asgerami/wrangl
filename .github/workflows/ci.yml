name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Skip tests that reach out to the public internet so CI is deterministic;
      # the local-HTTP and in-memory tests still run. Nightly re-enables them.
      - run: npm test
        env:
          WRANGL_SKIP_NETWORK: "1"

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: wrangl
          POSTGRES_PASSWORD: wrangl
          POSTGRES_DB: wrangl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wrangl -d wrangl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          WRANGL_SKIP_NETWORK: "1"
          WRANGL_PG_URL: postgres://wrangl:wrangl@localhost:5432/wrangl

  # The Docker image is a documented way to run Wrangl, so build it on every
  # change; a missing file in the build context once broke it unnoticed.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wrangl:ci .
      - name: Smoke-test the image
        run: docker run --rm --entrypoint node wrangl:ci dist/cli.js --version
