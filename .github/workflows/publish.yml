name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No dependency cache: a poisoned cache must never reach a release.
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          WRANGL_SKIP_NETWORK: "1"
      - name: Verify pack contents
        run: |
          tarball=$(npm pack --loglevel=silent)
          tar -tzf "$tarball" | grep -q 'package/prebuilt/manifest.json'
          tar -tzf "$tarball" | grep -q 'package/dist/controlplane/dashboard.html'
          rm -f "$tarball"
      - name: Check if version is already published
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing: npm authenticates this workflow through GitHub's
      # OIDC token (hence `id-token: write`), so no npm token is stored, and
      # provenance is generated automatically. Needs npm >= 11.5.1.
      - name: Install npm with trusted-publishing support
        if: steps.check.outputs.published == 'false'
        run: npm install -g npm@^11.5.1 && npm --version
      - run: npm publish --access public
        if: steps.check.outputs.published == 'false'
